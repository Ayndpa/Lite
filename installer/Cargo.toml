[package]
name = "lite-setup"
version = "0.1.0"
edition = "2021"
description = "Installer for Lite: one self-contained executable with the app and its plugins embedded."

[dependencies]
# Software renderer: no GPU or driver requirements, so the installer starts anywhere (VMs, RDP).
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
# Shortcuts, context menus, PATH, "Open with" — the same code the app's settings use.
lite-integration = { path = "../integration" }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
slint-build = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
